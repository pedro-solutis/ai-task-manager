server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # O fallback padrão para aplicações SPA (React/Vite)
    # Qualquer rota que não corresponder a um arquivo físico será redirecionada para o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Configuração de cache otimizada para arquivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Bloqueia o acesso a arquivos ocultos (ex: .git, .env)
    location ~ /\. {
        deny all;
    }
}

